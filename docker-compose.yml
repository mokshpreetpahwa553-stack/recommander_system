services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: recommander_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recommander_system"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: recommander_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_PORT: 5432
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
    stdin_open: true
    tty: true

volumes:
  postgres_data:
